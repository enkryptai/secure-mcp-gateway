name: Build, Validate, and Publish Python Package to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync project environment
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run --group test pytest -x -q

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync build environment
        run: uv sync --frozen --group build

      - name: Build
        run: uv run --group build python -m build

      - name: Validate metadata (pyroma)
        run: uv run --group build python -m pyroma .

      - name: Validate with twine
        run: uv run --group build python -m twine check dist/*

      - name: Validate wheel contents
        run: uv run --group build check-wheel-contents dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv run --group build python -m twine upload --skip-existing dist/*
