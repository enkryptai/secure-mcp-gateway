apiVersion: 1

# ---------------------------------------------------------------------------
# Notification policy tree.
#
# Routing rules:
#   * severity=critical → fire to Slack immediately, no grouping wait, repeat
#                         every 4 h until resolved.
#   * severity=warning  → fire to Slack with 5 min group wait so a small
#                         burst is consolidated into one message; repeat
#                         every 12 h.
#   * everything else   → catch-all root, same Slack channel, conservative
#                         repeat interval.
#
# group_by: includes every per-instance discriminator the rules expose
# (server_name, tool_name, failure_reason, check_kind, direction, user_id)
# so that distinct fingerprints land as distinct Slack messages.  Labels
# that are absent on a given alert are simply ignored by Grafana — adding
# them here is safe.
# ---------------------------------------------------------------------------

policies:
  - orgId: 1
    receiver: slack-grafana-alerts
    group_by:
      - alertname
      - severity
      - server_name
      - tool_name
      - failure_reason
      - check_kind
      - direction
      - user_id
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: slack-grafana-alerts
        matchers:
          - severity = critical
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 4h
        continue: false

      - receiver: slack-grafana-alerts
        matchers:
          - severity = warning
        group_wait: 5m
        group_interval: 5m
        repeat_interval: 12h
        continue: false
